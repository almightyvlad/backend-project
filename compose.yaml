services:
  postgres:
    image: postgres:17
    container_name: backend-project-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backend_project
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
